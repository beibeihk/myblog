# Personal blog overrides: writing, research, and everyday life.
custom_css:
  - /css/papers.css
  - /css/resume.css
  - /css/lab.css

# Keep the personal avatar visible immediately; post images remain lazy loaded.
lazyload:
  enable: true
  onlypost: true

favicon: /img/kh-mark.svg
apple_touch_icon: /img/kh-mark.svg

navbar:
  blog_title: 黄坤的空间
  menu:
    - { key: home, name: 首页, link: /, icon: 'iconfont icon-home-fill' }
    - { key: archive, name: 文章, link: /archives/, icon: 'iconfont icon-archive-fill' }
    - { key: research, name: 研究成果, link: /research/, icon: 'iconfont icon-category-fill' }
    - { key: resume, name: 简历, link: /resume/, icon: 'iconfont icon-addrcard' }
    - { key: about, name: 关于, link: /about/, icon: 'iconfont icon-user-fill' }

fun_features:
  typing:
    enable: false

banner:
  parallax: false
  width_height_ratio: 0

scroll_down_arrow:
  enable: false

index:
  banner_img: /img/swan_lake.jpg
  banner_img_height: 74
  banner_mask_alpha: 0
  slogan:
    enable: true
    text: '摛门不安横，无复相关意。'

post:
  banner_img: /img/swan_lake.jpg
  banner_img_height: 44
  banner_mask_alpha: 0.25

archive:
  banner_img: /img/swan_lake.jpg
  banner_img_height: 44

about:
  banner_img: /img/swan_lake.jpg
  banner_img_height: 44
  avatar: /img/dreamer.jpg
  name: Kun Huang（黄坤）
  intro: 双鱼男，INFP

page:
  banner_img: /img/swan_lake.jpg
  banner_img_height: 44

color:
  body_bg_color: '#f8f5ee'
  body_bg_color_dark: '#151b22'
  navbar_bg_color: '#25303d'
  navbar_bg_color_dark: '#141a21'
  board_color: '#ffffff'
  board_color_dark: '#202a32'
  text_color: '#27333d'
  text_color_dark: '#e9e4da'
  sec_text_color: '#69747c'
  sec_text_color_dark: '#b6bbb9'
  post_text_color: '#303941'
  post_text_color_dark: '#e9e4da'
  post_heading_color: '#24313a'
  post_heading_color_dark: '#f5eee0'
  post_link_color: '#287e84'
  post_link_color_dark: '#8bc8bf'
  link_hover_color: '#b27352'
  link_hover_color_dark: '#dca782'
